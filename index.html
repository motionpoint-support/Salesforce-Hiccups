<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesforce hiccups | Support training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF5; --ink:#15233A; --muted:#55667D; --surface:#FFFFFF; --line:#CFD9E4;
  --amber:#E89A00; --green:#1F7F54; --blue:#1F5FA8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1726; --ink:#E5ECF4; --muted:#9DAEC2; --surface:#16233A; --line:#2B3D58; --blue:#8DBBF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1726; --ink:#E5ECF4; --muted:#9DAEC2; --surface:#16233A; --line:#2B3D58; --blue:#8DBBF0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.page{max-width:1200px;margin:0 auto;padding:28px 20px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:800 clamp(30px,4.4vw,44px)/1.02 var(--display);letter-spacing:-.015em;margin:0}
.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.lib{color:var(--blue);font-weight:700;text-decoration-thickness:2px;text-underline-offset:3px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:1fr}}

/* Player */
.stage-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F3F7FB;border:1px solid var(--line)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(21,35,58,.35);border:0;cursor:pointer;color:#fff;font:800 22px var(--display);z-index:5}
.overlay span{display:flex;align-items:center;gap:14px;background:#15233A;padding:16px 26px 16px 18px;border-radius:999px}
.overlay svg{width:40px;height:40px}
.overlay[hidden]{display:none}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.btn svg{width:20px;height:20px}
.btn.main{width:52px;height:52px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segs{flex:1 1 260px;display:flex;gap:4px;min-width:200px}
.seg{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;cursor:pointer;border:0;padding:0}
.seg i{display:block;height:100%;width:0;background:var(--amber)}
.tog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 15px;font:700 14px var(--body);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:14px;min-width:84px;text-align:right}
.caption{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:14px 18px;font-size:18px;line-height:1.55;min-height:5.4em}
.caption[hidden]{display:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.vol{display:flex;align-items:center}
.vol input{width:90px;accent-color:var(--amber)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Chapters */
.chapters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px}
.chapters h2{font:800 20px var(--display);margin:0 6px 10px}
.chapters ol{list-style:none;margin:0;padding:0;counter-reset:c}
.chapters li{counter-increment:c}
.chapters button{width:100%;text-align:left;border:0;background:none;color:var(--ink);font:15px/1.35 var(--body);padding:8px 10px 8px 40px;border-radius:8px;cursor:pointer;position:relative}
.chapters button::before{content:counter(c);position:absolute;left:10px;top:8px;width:22px;text-align:right;color:var(--muted);font-weight:700}
.chapters button:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.chapters button[aria-current="true"]{background:color-mix(in srgb,var(--amber) 18%,transparent);font-weight:700}
.chapters button[aria-current="true"]::before{color:var(--ink)}
.note{color:var(--muted);font-size:14px;margin:14px 6px 0}

/* Stage (fixed 1280x720, scaled to fit) */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;color:#15233A;font-family:var(--body)}
.stage.paused,.stage.paused *{animation-play-state:paused!important}
.scene{position:absolute;inset:0;padding:60px 76px;visibility:hidden}
.scene.active{visibility:visible}
.split{display:grid;grid-template-columns:440px 1fr;gap:56px;height:100%;align-items:center}
.scene h2{font:800 58px/1.02 var(--display);letter-spacing:-.018em;margin:0 0 20px}
.scene p{font-size:25px;line-height:1.42;color:#45566E;margin:0 0 16px}
.scene p.fix{color:#15233A;font-weight:700;border-left:6px solid #1F7F54;padding-left:16px}
.num{width:66px;height:66px;border-radius:50%;background:#E89A00;color:#fff;font:800 36px/66px var(--display);text-align:center;margin-bottom:22px}

/* Motion utilities: only run on the active scene */
.a{opacity:0}
.scene.active .a{animation:rise .6s cubic-bezier(.2,.7,.2,1) var(--d,0s) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scene.active .flag{animation:flag .5s var(--d,0s) forwards}
.scene.active .flagok{animation:flag .5s var(--d,0s) forwards,ok .5s var(--d2,0s) forwards}
@keyframes flag{to{background:#FFF0C7;box-shadow:inset 6px 0 0 #E89A00}}
@keyframes ok{to{background:#DCF2E6;box-shadow:inset 6px 0 0 #1F7F54}}
.swap{position:relative;display:block;height:30px}
.swap>span{position:absolute;left:0;top:0;white-space:nowrap}
.swap .new{opacity:0;font-weight:700;color:#1F7F54}
.scene.active .swap .old{animation:fadeup .35s var(--d) forwards}
.scene.active .swap .new{animation:popin .5s calc(var(--d) + .25s) forwards}
@keyframes fadeup{to{opacity:0;transform:translateY(-10px)}}
@keyframes popin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scene.active .pulse{animation:pulse 1s var(--d,0s) 2}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,154,0,.45)}}
.hic{opacity:0;position:absolute;background:#E89A00;color:#fff;font:800 24px var(--display);padding:6px 14px;border-radius:999px}
.scene.active .hic{animation:hic .8s var(--d,0s) forwards}
@keyframes hic{0%{opacity:0;transform:scale(.3) translateY(12px)}60%{opacity:1;transform:scale(1.15) translateY(-6px)}100%{opacity:1;transform:none}}
.tick{opacity:0;color:#1F7F54}
.scene.active .tick{animation:popin .4s var(--d,0s) forwards}

/* Salesforce-style mock records (generic) */
.card{background:#fff;border:1px solid #D2DBE6;border-radius:12px;overflow:hidden}
.card-h{display:flex;gap:16px;align-items:center;padding:18px 24px;border-bottom:1px solid #E3E9F0}
.ico{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:26px;height:26px}
.ico.contact{background:#7A3FB6}.ico.account{background:#4F5FD8}
.card-h small{display:block;font-size:16px;color:#5A6B82}
.card-h strong{display:block;font:800 28px/1.1 var(--display)}
.rows{padding:6px 16px 12px}
.row{display:grid;grid-template-columns:230px 1fr 40px;align-items:center;padding:12px 12px;border-bottom:1px solid #EEF2F6;font-size:21px;border-radius:6px}
.row:last-child{border-bottom:0}
.lab{color:#5A6B82}
.link{color:#1F5FA8;text-decoration:underline dotted;text-underline-offset:4px}
.sw{width:34px;height:34px;border-radius:7px;border:2px solid #1F7F54;color:#1F7F54;display:grid;place-items:center}
.sw svg{width:20px;height:20px}
.stack{display:grid;gap:22px}

/* Scene: title */
.title-wrap h1{font:800 112px/.92 var(--display);letter-spacing:-.03em;margin:0 0 26px}
.title-wrap p{font-size:30px;color:#45566E;max-width:20ch}
.casebox{position:relative;width:340px;height:250px;margin:auto;background:#fff;border:3px solid #15233A;border-radius:18px;padding:30px}
.casebox b{display:block;font:800 34px var(--display);margin-bottom:22px}
.casebox i{display:block;height:14px;border-radius:7px;background:#D7E0EA;margin-bottom:14px}
.scene.active .hop{animation:hop 2.6s ease-in-out .8s infinite}
@keyframes hop{0%,55%,100%{transform:none}62%{transform:translateY(-26px) rotate(-3deg)}70%{transform:none}76%{transform:translateY(-12px) rotate(2deg)}84%{transform:none}}

/* Scene: symptoms */
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}
.win{background:#fff;border:1px solid #D2DBE6;border-radius:12px;overflow:hidden;min-height:400px}
.win-bar{height:42px;background:#E6EDF5;display:flex;align-items:center;padding:0 18px;font:700 17px var(--body);color:#55667D}
.win-body{padding:24px 26px}
.win-body h3{font:800 28px var(--display);margin:0 0 18px}
.sbtn{display:inline-block;background:#1F5FA8;color:#fff;font:700 20px var(--body);padding:12px 22px;border-radius:8px}
.toast{margin-top:26px;background:#FFF0C7;border-left:6px solid #E89A00;padding:16px 18px;border-radius:6px;font-size:20px}
.mail{border:1px solid #D2DBE6;border-radius:10px;padding:14px 16px;font-size:19px;line-height:1.4}
.mail b{display:block}
.down{font:800 34px var(--display);color:#8A99AD;text-align:center;margin:8px 0}
.empty{border:3px dashed #E89A00;border-radius:10px;padding:18px;text-align:center;font:700 21px var(--body);color:#9A6500;background:#FFF8E6}

/* Scene: gates */
.track{position:relative;height:300px;border-top:4px solid #D2DBE6;top:150px}
.track-wrap{position:relative;height:420px}
.gate{position:absolute;top:-80px;width:18px;height:160px;border-radius:9px;background:#B8C5D4}
.gate-lab{position:absolute;top:178px;width:220px;margin-left:-101px;text-align:center;font:700 21px/1.25 var(--body);color:#45566E}
.scene.active .g1{animation:gok .3s 1.5s forwards}
.scene.active .g2{animation:gbad .3s 2.9s forwards}
@keyframes gok{to{background:#1F7F54}}
@keyframes gbad{to{background:#E89A00}}
.env{position:absolute;left:20px;top:-46px;width:100px;height:68px}
.scene.active .env{animation:travel 3.6s .6s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes travel{0%{transform:translateX(0)}40%{transform:translateX(400px)}65%{transform:translateX(500px)}74%{transform:translateX(420px) rotate(-8deg)}84%{transform:translateX(470px) rotate(3deg)}100%{transform:translateX(455px)}}
.endlab{position:absolute;right:0;top:-34px;font:800 30px var(--display);color:#9A6500}

/* Scene: email issues */
.issues{display:grid;gap:18px;margin-top:22px}
.issue{display:grid;grid-template-columns:300px 1fr 300px;gap:26px;align-items:center;background:#fff;border:1px solid #D2DBE6;border-radius:12px;padding:18px 24px}
.issue h3{font:800 26px/1.1 var(--display);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:18px}
.chip{background:#EEF3F8;border-radius:8px;padding:8px 12px}
.chip.bad{background:#FFF0C7}
.issue .f{font-size:19px;font-weight:700;color:#1F7F54;border-left:5px solid #1F7F54;padding-left:12px}

/* Scene: steps / checklist */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.steps li{display:grid;grid-template-columns:58px 1fr 40px;gap:18px;align-items:center;background:#fff;border:1px solid #D2DBE6;border-radius:12px;padding:20px 22px;font-size:24px}
.steps .n{width:50px;height:50px;border-radius:50%;background:#15233A;color:#fff;font:800 26px/50px var(--display);text-align:center}
.tabs{display:flex;gap:30px;padding:0 24px;border-bottom:1px solid #E3E9F0;font:700 21px var(--body)}
.tabs span{padding:14px 0;color:#5A6B82;border-bottom:4px solid transparent}
.scene.active .tabon{animation:tabon .4s var(--d) forwards}
@keyframes tabon{to{color:#15233A;border-bottom-color:#1F5FA8}}
.rel-h{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 8px;font:800 23px var(--display)}
.rel-h .cnt{display:inline-block;position:relative;width:40px;height:30px;vertical-align:top}
.addrel{background:#FFF7D6;border:2px solid #E89A00;border-radius:8px;padding:8px 14px;font:700 18px var(--body)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 24px 24px}
.tile{display:flex;gap:12px;align-items:center;border:1px solid #D2DBE6;border-radius:10px;padding:12px 14px;font-size:19px}
.tile .ico{width:34px;height:34px;border-radius:7px}
.tile .ico svg{width:20px;height:20px}
.tile.new{border:2px solid #1F7F54;background:#EEF9F3}
.tile small{display:block;color:#5A6B82;font-size:15px}
.big-check{max-width:900px;margin:30px auto 0}
.endchip{display:inline-block;margin-top:28px;background:#15233A;color:#fff;font:800 24px var(--display);padding:12px 22px;border-radius:999px}

/* Error example and tab panels */
.err-title{font:600 22px var(--body);color:#2B3A4F;margin:0 0 16px}
.err{color:#C8102E;font-size:19px;line-height:1.4}
.err b{display:block;font-size:20px}
.tabhead{display:flex;align-items:baseline;gap:12px;padding:16px 22px 8px}
.tabhead b{font:800 24px var(--display);color:#1F5FA8;border-bottom:4px solid #1F5FA8;padding-bottom:4px}
.tabhead span{color:#5A6B82;font-size:19px}
.mini-tiles{display:flex;gap:10px;flex-wrap:wrap;padding:6px 22px 20px}
.mini-tiles span{display:flex;gap:8px;align-items:center;border:1px solid #D2DBE6;border-radius:8px;padding:8px 12px;font-size:18px}
.scene.active .hl{animation:hl .5s var(--d,0s) forwards}
@keyframes hl{to{background:#E3EEFA;box-shadow:inset 6px 0 0 #1F5FA8}}
.xmark{display:grid;place-items:center}
.xmark svg{width:30px;height:30px}
.shot{margin:0;background:#fff;border:1px solid #D2DBE6;border-radius:12px;padding:12px}
.shot img{display:block;width:100%;border-radius:6px}
.shot figcaption{font-size:17px;color:#5A6B82;margin-top:8px}
.mini-tiles .ico svg{width:16px;height:16px}
.tabs .on{color:#15233A;border-bottom-color:#1F5FA8}
@media (prefers-reduced-motion: reduce){
  .scene.active *{animation-duration:.01s!important}
  .scene.active .hop{animation:none!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>Salesforce hiccups</h1>
      <p>Why a customer can’t create a case, and how Support can spot and fix it.</p>
    </div>
    <a class="lib" href="https://motionpoint-support.github.io/Support-Training-Library/">Support Training Library</a>
  </header>

  <div class="layout">
    <main>
      <div class="stage-wrap" id="wrap">
        <div class="stage" id="stage"></div>
        <button class="overlay" id="overlay" aria-label="Play training">
          <span><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#E89A00"/><path d="M16 12l13 8-13 8z" fill="#fff"/></svg>Play training</span>
        </button>
      </div>

      <div class="controls">
        <button class="btn" id="prev" aria-label="Previous scene"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
        <button class="btn main" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
        <button class="btn" id="next" aria-label="Next scene"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button>
        <div class="segs" id="segs"></div>
        <span class="count" id="count"></span>
        <button class="tog" id="music" aria-pressed="true">Music</button>
        <label class="vol"><span class="sr">Music volume</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.5"></label>
        <button class="tog" id="cc" aria-pressed="true">Captions</button>
      </div>
      <div class="caption" id="caption" aria-live="polite"></div>
    </main>

    <aside class="chapters">
      <h2>Chapters</h2>
      <ol id="chapters"></ol>
      <p class="note">Space plays or pauses, arrow keys move between scenes, and M turns the music on or off. Customer names in this training are examples.</p>
    </aside>
  </div>
</div>

<script>
const I = {
  contact:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="11" r="2.3" fill="currentColor"/><path d="M5.5 16.5c.8-2 2-3 3.5-3s2.7 1 3.5 3M14 10h4M14 13.5h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  account:'<svg viewBox="0 0 24 24"><path d="M4 21V5h9v16M13 9h7v12M7 8h3M7 12h3M7 16h3M16 13h2M16 17h2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="30" height="30"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sw:'<svg viewBox="0 0 24 24"><path d="M5 9h12l-3-3M19 15H7l3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#D62839"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>',
  env:'<svg viewBox="0 0 100 68"><rect x="2" y="2" width="96" height="64" rx="8" fill="#fff" stroke="#15233A" stroke-width="4"/><path d="M6 8l44 32L94 8" fill="none" stroke="#15233A" stroke-width="4" stroke-linejoin="round"/></svg>'
};
const swap = (o, n, d) => `<span class="swap" style="--d:${d}s"><span class="old">${o}</span><span class="new">${n}</span></span>`;
const row = (lab, val, extra = '', cls = '', style = '') =>
  `<div class="row ${cls}" style="${style}"><span class="lab">${lab}</span><span class="val">${val}</span><span>${extra}</span></div>`;
const head = (kind, label, name) =>
  `<div class="card-h"><span class="ico ${kind}">${I[kind]}</span><span><small>${label}</small><strong>${name}</strong></span></div>`;
const tile = (name, sub = '', cls = '', style = '') =>
  `<div class="tile ${cls}" style="${style}"><span class="ico account">${I.account}</span><span>${name}${sub ? `<small>${sub}</small>` : ''}</span></div>`;

const scenes = [
{ t:'Welcome',
  cap:'Hi, and welcome! In the next few minutes you’ll learn why a customer sometimes can’t create a case, and the three simple checks that fix it most of the time.',
  html:`<div class="split">
    <div class="title-wrap">
      <h1 class="a" style="--d:.2s">Salesforce hiccups</h1>
      <p class="a" style="--d:.7s">Why a customer can’t create a case, and how to fix it</p>
    </div>
    <div style="position:relative">
      <div class="a" style="--d:.4s"><div class="casebox hop"><b>New case</b><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i><i style="width:45%"></i></div></div>
      <span class="hic" style="--d:1.6s;right:40px;top:-30px">hic!</span>
      <span class="hic" style="--d:2.3s;left:20px;bottom:-24px">hic!</span>
    </div>
  </div>`},

{ t:'What the customer sees',
  cap:'When this happens, customers usually tell their CXM or email Support. In MP+, they may see an error like this one: “An unhandled fault has occurred in this flow.” And when a 24/7 Tier 1 customer emails support@motionpoint.com, the email arrives, but no case is created in Salesforce.',
  html:`<h2 class="a" style="--d:.1s">What the customer sees</h2>
  <div class="two">
    <div class="win a" style="--d:.4s"><div class="win-bar">cases.motionpoint.com</div>
      <div class="win-body">
        <p class="err-title a" style="--d:.9s">MP Customer Case Submission - Screen Flow</p>
        <div class="err a" style="--d:1.6s"><b>An unhandled fault has occurred in this flow</b>An unhandled fault has occurred while processing the flow. Please contact your system administrator for more information.</div>
        <p class="a" style="--d:3s;font-size:19px;margin:22px 0 0">Example error in MP+. The customer usually tells their CXM, or emails Support.</p>
      </div></div>

{ t:'The logic behind it',
  cap:'Here’s the logic. Before a case is created, Salesforce asks one question: is this person a customer contact? To answer it, it checks three things: the contact’s account, the Details tab, and the Related tab. If any one check fails, no case is created.',
  html:`<h2 class="a" style="--d:.1s">Is this person a customer contact?</h2>
  <p class="a" style="--d:.4s;max-width:46ch">Salesforce checks three things. All three have to pass.</p>
  <div class="track-wrap">
    <div class="track">
      <div class="env">${I.env}</div>
      <div class="gate g1" style="left:360px"><div class="gate-lab">The account</div></div>
      <div class="gate g2" style="left:620px"><div class="gate-lab">The Details tab</div></div>
      <div class="gate" style="left:880px"><div class="gate-lab">The Related tab</div></div>
      <span class="hic" style="--d:3s;left:560px;top:-130px">hic!</span>
      <div class="endlab a" style="--d:3.9s">No case</div>
    </div>
  </div>`},

{ t:'Two tabs to know',
  cap:'Every contact record has two tabs you’ll use. The Details tab says who the person is: that’s where Contact Record Type must say Customer. The Related tab says what they can open cases for: that’s where you link them to each business entity, or BE.',
  html:`<div class="split">
    <div>
      <h2 class="a" style="--d:.2s">Two tabs to know</h2>
      <p class="a" style="--d:.6s"><b style="color:#15233A">Details</b> says who the person is.</p>
      <p class="a" style="--d:3.4s"><b style="color:#15233A">Related</b> says what they can open cases for.</p>
    </div>
    <div class="stack">
      <div class="card a" style="--d:1s">
        <div class="tabhead"><b>Details</b><span>Who they are</span></div>
        <div class="rows">${row('Contact Record Type','Customer','','hl','--d:2s')}${row('Type','Customer')}</div>
      </div>
      <div class="card a" style="--d:3.8s">
        <div class="tabhead"><b>Related</b><span>What they can open cases for</span></div>
        <div class="mini-tiles hl" style="--d:4.8s;margin:0 14px 14px;border-radius:8px;padding-top:12px">
          <span><span class="ico account" style="width:28px;height:28px;border-radius:6px">${I.account}</span>Harbor Savings Bank</span>
          <span><span class="ico account" style="width:28px;height:28px;border-radius:6px">${I.account}</span>HSB – Mortgage</span>
        </div>
      </div>
    </div>
  </div>`},

{ t:'Check 1: the account',
  cap:'First check: the account. In this example, the contact was added to an agency whose Type is Active Partner. Partners don’t get customer access, so the fix is to move the contact to an actual, active customer account.',
  html:`<div class="split">
    <div>
      <div class="num a">1</div>
      <h2 class="a" style="--d:.2s">Check the account</h2>
      <p class="a" style="--d:.5s">This contact was added under an agency whose Type is Active Partner. Partners don’t get customer access.</p>
      <p class="fix a" style="--d:4.4s">Move the contact to an actual, active customer account.</p>
    </div>
    <div class="stack">
      <div class="card a" style="--d:.6s">${head('account','Account','Brightline Agency')}
        <div class="rows">${row('Type','Active Partner',`<span class="xmark a" style="--d:1.8s">${I.x}</span>`,'flag','--d:1.4s')}</div></div>
      <div class="card a" style="--d:2.2s">${head('contact','Contact','Dana Ruiz')}
        <div class="rows">${row('Account Name', swap('<span class="link">Brightline Agency</span>','Harbor Savings Bank',4), '', 'flagok','--d:2.8s;--d2:4.3s')}</div></div>
    </div>
  </div>`},

{ t:'Check 2: the Details tab',
  cap:'Second check: the Details tab. Look at Contact Record Type. If it says Unknown, click the switch icon next to it and choose Customer. Then set the Type field to Customer too.',
  html:`<div class="split">
    <div>
      <div class="num a">2</div>
      <h2 class="a" style="--d:.2s">Check the Details tab</h2>
      <p class="a" style="--d:.5s">Contact Record Type says Unknown, so this person can’t open cases yet.</p>
      <p class="fix a" style="--d:4s">Switch Contact Record Type to Customer, then set Type to Customer.</p>
    </div>
    <div class="card a" style="--d:.4s">${head('contact','Contact','Dana Ruiz')}
      <div class="tabs"><span class="tabon" style="--d:.9s">Details</span><span>Related</span></div>
      <div class="rows">
        ${row('Account Name','<span class="link">Harbor Savings Bank</span>')}
        ${row('Contact Record Type', swap('Unknown','Customer',3.4), `<span class="sw pulse" style="--d:2.2s">${I.sw}</span>`, 'flagok','--d:1.4s;--d2:3.7s')}
        ${row('Type', swap('Unknown','Customer',5.2), '', 'flagok','--d:4.5s;--d2:5.5s')}
        ${row('Title','Account Coordinator')}
      </div></div>
  </div>`},

{ t:'Check 3: the Related tab',
  cap:'Third check: the Related tab. Scroll to Related Accounts. If the business entity the customer needs isn’t listed, click Add Relationship and add it. Repeat for every BE they’ll open cases for in MP+.',
  html:`<div class="split">
    <div>
      <div class="num a">3</div>
      <h2 class="a" style="--d:.2s">Check the Related tab</h2>
      <p class="a" style="--d:.5s">A contact can only open cases for the business entities listed here.</p>
      <p class="fix a" style="--d:4.6s">Click Add Relationship for each BE they need.</p>
    </div>
    <div class="card a" style="--d:.4s">${head('contact','Contact','Dana Ruiz')}
      <div class="tabs"><span>Details</span><span class="tabon" style="--d:1.1s">Related</span></div>
      <div class="a" style="--d:1.6s">
        <div class="rel-h"><span>Related Accounts <span class="cnt">${swap('(3)','(4)',4.2)}</span></span><span class="addrel pulse" style="--d:2.6s">Add Relationship</span></div>
        <div class="tiles">
          ${tile('Harbor Savings Bank','Direct')}
          ${tile('Harbor Savings Bank – Mortgage')}
          ${tile('Harbor Savings Bank – Commercial')}
          ${tile('Harbor Savings Bank – Wealth','Just added','new a','--d:4.2s')}
        </div>
      </div></div>
  </div>`},

{ t:'For emails: the address',
  cap:'For emails, there’s one more thing: the sender’s address has to match one contact. Watch for aliases or new people with no contact yet, two contacts sharing one email, like an old zz contact, and replies to an old thread, which land on the existing case instead of a new one.',
  html:`<div style="display:flex;gap:22px;align-items:center"><div class="num a" style="margin:0">+</div><h2 class="a" style="--d:.2s;margin:0">For emails, check the address</h2></div>
  <div class="issues">
    <div class="issue a" style="--d:1s"><h3>Sender doesn’t match the contact</h3>
      <div class="chips"><span class="chip bad">From: druiz@harborsb.com</span><span>≠</span><span class="chip">Contact: dana.ruiz@harborsb.com</span></div>
      <span class="f">Add the person as a contact, or fix the email.</span></div>
    <div class="issue a" style="--d:3.6s"><h3>Two contacts, one email</h3>
      <div class="chips"><span class="chip">Dana Ruiz</span><span class="chip bad">zz Dana Ruiz</span><span>same address</span></div>
      <span class="f">Clean up the duplicate.</span></div>
    <div class="issue a" style="--d:6.2s"><h3>Reply to an old thread</h3>
      <div class="chips"><span class="chip">Re: Spanish site isn’t loading</span><span>→</span><span class="chip bad">Added to the existing case</span></div>
      <span class="f">Check the older case first.</span></div>
  </div>`},

{ t:'After the fix',

/* ---------- Soft jazz (generated in the browser, no audio files) ---------- */
const Music = (() => {
  let ctx = null, master, timer = null, nextTime = 0, step = 0, noise, on = true, vol = .5;
  const beat = 60 / 84;
  const LEVEL = .32;
  const bars = [
    { walk:[43,46,50,49], chord:[53,57,58,62] }, // Gm9
    { walk:[48,45,43,40], chord:[52,58,62,67] }, // C9
    { walk:[41,45,48,49], chord:[52,57,60,67] }, // Fmaj9
    { walk:[50,45,41,44], chord:[53,57,60,64] }, // Dm9
    { walk:[46,50,45,40], chord:[50,57,60,65] }, // Bbmaj9
    { walk:[39,43,46,44], chord:[55,61,65] },    // Eb9
    { walk:[45,48,52,51], chord:[55,60,64,67] }, // Am7
    { walk:[50,54,45,44], chord:[54,60,63] }     // D7b9
  ];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const human = () => (Math.random() - .5) * .016;

  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5200;
    const verb = ctx.createConvolver(), wet = ctx.createGain(); wet.gain.value = .22;
    const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir;
    master.connect(tone); tone.connect(ctx.destination); tone.connect(verb); verb.connect(wet); wet.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return true;
  }
  function env(g, t, peak, attack, decay){
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
  }
  function bass(m, t){
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(m);
    f.type = 'lowpass'; f.frequency.value = 520;
    env(g, t, .55, .015, beat * .95);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + beat * 1.1);
  }
  function guitar(notes, t, len){
    notes.forEach((m, k) => {
      const s = t + k * .016, g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1600;
      [0, 4].forEach(det => { const o = ctx.createOscillator(); o.type = det ? 'sine' : 'triangle'; o.frequency.value = hz(m); o.detune.value = det; o.connect(f); o.start(s); o.stop(s + len + .1); });
      env(g, s, .07, .008, len);
      f.connect(g); g.connect(master);
    });
  }
  function hiss(t, type, freq, q, peak, attack, decay){
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g, t, peak, attack, decay);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + attack + decay + .05);
  }
  function kick(t, peak){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(42, t + .16);
    env(g, t, peak, .005, .22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }
  function schedule(t){
    const b = step % 4, bar = bars[Math.floor(step / 4) % bars.length], swing = beat * 2 / 3;
    hiss(t + human(), 'highpass', 7500, .5, b % 2 ? .05 : .04, .002, .28);           // ride
    if (b === 1 || b === 3){
      hiss(t + swing + human(), 'highpass', 7500, .5, .028, .002, .18);              // ride skip note
      hiss(t + human(), 'bandpass', 2400, .6, .045, .035, .22);                      // brush on 2 and 4
    }
    if (b === 0) kick(t, .22);
    if (b === 2) kick(t, .1);
    if (b === 0) guitar(bar.chord, t + human(), beat * 1.3);
    if (b === 1) guitar(bar.chord, t + swing + human(), beat * .6);
  }
  function loop(){
    while (nextTime < ctx.currentTime + .25){ schedule(nextTime); nextTime += beat; step++; }
  }
  function level(sec){
    if (!ctx) return;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(on ? vol * LEVEL : 0, now + sec);
  }
  return {
    start(){
      if (!ctx && !init()) return;
      ctx.resume();
      if (!timer){ nextTime = ctx.currentTime + .1; timer = setInterval(loop, 50); }
      level(2);
    },
    pause(){ if (ctx){ level(.4); setTimeout(() => { if (ctx && !playing) ctx.suspend(); }, 450); } },
    setOn(v){ on = v; level(.6); },
    setVol(v){ vol = v; level(.2); }
  };
})();

/* ---------- Player ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap'), capEl = $('caption'), playBtn = $('play'), overlay = $('overlay');
stage.innerHTML = scenes.map(s => `<section class="scene" aria-hidden="true">${s.html}</section>`).join('');
const els = [...stage.children];
scenes.forEach(s => { const w = s.cap.split(/\s+/).length; s.dur = Math.max(9, w / 2.6 + 3); });

$('segs').innerHTML = scenes.map(s => `<button class="seg" aria-label="Go to ${s.t}"><i></i></button>`).join('');
const segs = [...$('segs').children];
$('chapters').innerHTML = scenes.map(s => `<li><button>${s.t}</button></li>`).join('');
const chaps = [...$('chapters').querySelectorAll('button')];

let idx = 0, elapsed = 0, playing = false, ended = false, last = null;

function go(i){
  idx = i; elapsed = 0;
  els.forEach((e, j) => { e.classList.remove('active'); e.setAttribute('aria-hidden', String(j !== i)); });
  void stage.offsetWidth;
  els[i].classList.add('active');
  capEl.textContent = scenes[i].cap;
  $('count').textContent = `Scene ${i + 1} of ${scenes.length}`;
  chaps.forEach((c, j) => c.setAttribute('aria-current', String(j === i)));
}
function setIcon(){
  const ic = $('playIcon');
  if (playing){ ic.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/>'; playBtn.setAttribute('aria-label','Pause'); }
  else if (ended){ ic.innerHTML = '<path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M3 5l2.5 5 4.6-3z" fill="currentColor"/>'; playBtn.setAttribute('aria-label','Watch again'); }
  else { ic.innerHTML = '<path d="M7 4l13 8-13 8z" fill="currentColor"/>'; playBtn.setAttribute('aria-label','Play'); }
}
function play(){
  overlay.hidden = true;
  stage.classList.remove('paused');
  if (ended){ ended = false; go(0); }
  playing = true; Music.start(); setIcon();
}
function pause(){ playing = false; stage.classList.add('paused'); Music.pause(); setIcon(); }
function finish(){ playing = false; ended = true; Music.pause(); setIcon(); }
function toggle(){ playing ? pause() : play(); }

function tick(ts){
  if (last === null) last = ts;
  const dt = Math.min(.25, (ts - last) / 1000); last = ts;
  if (playing){
    elapsed += dt;
    if (elapsed >= scenes[idx].dur){ if (idx < scenes.length - 1) go(idx + 1); else finish(); }
  }
  segs.forEach((g, j) => {
    const f = j < idx ? 1 : j > idx ? 0 : (ended ? 1 : Math.min(1, elapsed / scenes[idx].dur));
    g.firstChild.style.width = (f * 100) + '%';
  });
  requestAnimationFrame(tick);
}
function jump(i){
  if (i < 0 || i >= scenes.length) return;
  ended = false; overlay.hidden = true;
  stage.classList.remove('paused');
  go(i); setIcon();
}

overlay.onclick = () => { ended = false; go(0); play(); };
playBtn.onclick = () => { if (!overlay.hidden){ overlay.click(); return; } toggle(); };
$('prev').onclick = () => jump(idx - 1);
$('next').onclick = () => jump(idx + 1);
segs.forEach((g, i) => g.onclick = () => jump(i));
chaps.forEach((c, i) => c.onclick = () => jump(i));
const musicBtn = $('music');
function toggleMusic(){ const on = musicBtn.getAttribute('aria-pressed') !== 'true'; musicBtn.setAttribute('aria-pressed', String(on)); Music.setOn(on); }
musicBtn.onclick = toggleMusic;
$('vol').oninput = e => Music.setVol(+e.target.value);
$('cc').onclick = e => { const on = capEl.hidden; capEl.hidden = !on; e.currentTarget.setAttribute('aria-pressed', String(on)); };
document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  const onControl = e.target.closest('button,a');
  if (e.key === ' ' && !onControl){ e.preventDefault(); if (!overlay.hidden) overlay.click(); else toggle(); }
  if (e.key === 'ArrowRight') jump(idx + 1);
  if (e.key === 'ArrowLeft') jump(idx - 1);
  if (e.key === 'm' || e.key === 'M') toggleMusic();
});

function fit(){ stage.style.transform = `scale(${wrap.clientWidth / 1280})`; }
new ResizeObserver(fit).observe(wrap); fit();

go(0); setIcon();
requestAnimationFrame(tick);
</script>
</body>
